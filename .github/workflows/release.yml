name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=lindwurm-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          ext=""; [ "${{ runner.os }}" = Windows ] && ext=.exe
          for b in lindwurm lindwurm-tui lindwurm-gui; do
            cp "target/${{ matrix.target }}/release/$b$ext" "$name/"
          done
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "$name/"
          [ "${{ runner.os }}" = Linux ] && cp contrib/70-lindwurm.rules "$name/"
          cp -r examples "$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            7z a "$name.zip" "$name" >/dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ASSET }}
          # Tags like v0.1.0-rc.1 are test builds.
          prerelease: ${{ contains(github.ref_name, '-') }}
